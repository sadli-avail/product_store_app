name: product_store
description: "Product Store Flutter Application - REST API Integration with CRUD and Local Cache"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # HTTP Networking for REST API calls
  http: ^1.2.2
  
  # Local Storage & Offline Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Network Image Caching & Smooth Loading
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
